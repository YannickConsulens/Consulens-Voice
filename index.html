<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Consulens Voice</title>
  <meta name="description" content="Spreek in het Nederlands — Claude verwerkt het automatisch">
  <meta name="theme-color" content="#1B3A6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Consulens Voice">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0F1E35;
      --brand: #1B3A6B;
      --accent: #2E6FD8;
      --accent-dim: rgba(46,111,216,0.12);
      --surface: #F7F9FC;
      --card: #FFFFFF;
      --muted: #8896A8;
      --success: #1A7A4A;
      --border: #DDE4EE;
      --danger: #C0392B;
      --radius: 16px;
    }

    html, body {
      height: 100%;
      background: var(--surface);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      overflow: hidden;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      background: var(--brand);
      padding: 14px 20px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header .logo { font-size: 13px; font-weight: 800; color: #fff; letter-spacing: 1.5px; }
    header .sub { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 1px; }
    header .mode-badge {
      margin-left: auto;
      font-size: 11px; font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
      cursor: pointer;
    }

    /* ── Main scroll area ── */
    .main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Transcript card ── */
    .transcript-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      min-height: 120px;
      flex: 1;
      position: relative;
    }
    .transcript-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 10px;
    }
    .transcript-text {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 14px; line-height: 1.7; color: var(--ink);
      white-space: pre-wrap; word-break: break-word;
    }
    .transcript-text.placeholder { color: var(--muted); font-family: inherit; font-size: 14px; }
    .interim { color: var(--accent); }

    .char-count {
      position: absolute; bottom: 10px; right: 14px;
      font-size: 11px; color: var(--muted);
    }

    /* ── Controls ── */
    .controls {
      flex-shrink: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 16px 20px 28px;
    }

    .record-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 14px;
    }

    /* Signature element: pulse-knop */
    .record-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      transition: transform 0.15s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 20px rgba(46,111,216,0.35);
    }
    .record-btn:active { transform: scale(0.94); }
    .record-btn.recording { background: var(--danger); box-shadow: 0 4px 20px rgba(192,57,43,0.4); }
    .record-btn svg { width: 32px; height: 32px; fill: white; }

    /* Pulse rings */
    .record-btn::before, .record-btn::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      pointer-events: none;
    }
    .record-btn.recording::before {
      width: 100%; height: 100%;
      animation: pulse1 1.6s ease-out infinite;
    }
    .record-btn.recording::after {
      width: 100%; height: 100%;
      animation: pulse1 1.6s ease-out 0.6s infinite;
    }
    .record-btn.recording::before, .record-btn.recording::after {
      background: var(--danger);
    }
    @keyframes pulse1 {
      0%   { transform: scale(1);    opacity: 0.5; }
      100% { transform: scale(2.2);  opacity: 0; }
    }

    .side-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .side-btn:active { background: var(--border); }
    .side-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .record-status {
      text-align: center;
      font-size: 12px; color: var(--muted);
      margin-bottom: 12px;
      min-height: 18px;
    }
    .record-status.active { color: var(--danger); font-weight: 600; }

    .send-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn:active { opacity: 0.8; }

    /* ── Result sheet ── */
    .sheet-overlay {
      position: fixed; inset: 0;
      background: rgba(15,30,53,0.5);
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .sheet-overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-width: 480px; margin: 0 auto;
      background: var(--card);
      border-radius: 20px 20px 0 0;
      padding: 0 0 32px;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
      z-index: 101;
      max-height: 85dvh;
      display: flex; flex-direction: column;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 0;
      flex-shrink: 0;
    }
    .sheet-header {
      padding: 14px 20px 12px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sheet-type-badge {
      padding: 4px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }
    .badge-verslag { background: #E8EEF8; color: var(--brand); }
    .badge-acties { background: #FEF3E2; color: #B45309; }
    .sheet-close {
      margin-left: auto;
      background: var(--surface); border: none;
      width: 32px; height: 32px; border-radius: 50%;
      cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }

    .sheet-body {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 16px 20px;
    }

    .result-summary {
      font-size: 14px; line-height: 1.7; color: var(--ink);
      background: var(--surface); border-radius: 10px;
      padding: 14px; margin-bottom: 16px;
    }

    .acties-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .actie-item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .actie-item.selected { border-color: var(--accent); background: rgba(46,111,216,0.05); }
    .actie-desc {
      font-size: 14px; color: var(--ink); margin-bottom: 6px;
      font-weight: 500;
    }
    .actie-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .actie-chip {
      font-size: 11px; padding: 3px 9px; border-radius: 20px;
      background: var(--accent-dim); color: var(--accent); font-weight: 600;
    }
    .actie-chip.deadline { background: #EEF8F0; color: var(--success); }

    .deadline-input {
      width: 100%; margin-top: 8px;
      padding: 7px 10px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 13px;
      font-family: inherit; color: var(--ink);
      background: var(--card);
    }
    .deadline-input:focus { outline: none; border-color: var(--accent); }

    .sheet-footer {
      padding: 12px 20px 0;
      display: flex; gap: 10px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }
    .sheet-footer .copy-btn {
      flex: 1; padding: 12px;
      background: var(--surface); color: var(--brand);
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .sheet-footer .notion-btn {
      flex: 2; padding: 12px;
      background: var(--accent); color: white;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .sheet-footer .notion-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .sheet-footer button:active { opacity: 0.8; }

    /* Projectkeuze voor Notion */
    .project-picker { margin-bottom: 14px; }
    .project-picker label {
      display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
    }
    .project-select {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 14px; font-family: inherit; color: var(--ink);
      background: var(--card);
    }
    .project-select:focus { outline: none; border-color: var(--accent); }

    /* Selecteerbare actiepunten */
    .actie-item { cursor: pointer; }
    .actie-check { display: none; color: var(--accent); font-weight: 800; margin-right: 6px; }
    .actie-item.selected .actie-check { display: inline; }

    /* Loading */
    .loading-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 20px; gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--muted); }

    /* Toast */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: white;
      padding: 10px 20px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      opacity: 0; transition: all 0.3s;
      z-index: 200; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Timer */
    .timer {
      font-variant-numeric: tabular-nums;
      font-size: 13px; color: var(--danger);
      font-weight: 700; min-width: 40px;
      display: none;
    }
    .timer.visible { display: block; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="logo">CONSULENS</div>
      <div class="sub">Voice Assistant</div>
    </div>
    <div class="mode-badge" id="modeBadge" onclick="toggleMode()">🎙 Notitie</div>
  </header>

  <div class="main">
    <div class="transcript-card">
      <div class="transcript-label">Transcript</div>
      <div class="transcript-text placeholder" id="transcriptEl">
Druk op de knop en spreek in het Nederlands.

Gebruik voor korte notities of tijdens een vergadering.</div>
      <div class="char-count" id="charCount"></div>
    </div>
  </div>

  <div class="controls">
    <div class="record-status" id="recordStatus">Klaar om op te nemen</div>
    <div class="record-row">
      <button class="side-btn" id="clearBtn" onclick="clearTranscript()" title="Wissen">🗑️</button>
      <button class="record-btn" id="recordBtn" onclick="toggleRecording()">
        <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v7a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm-7 8a1 1 0 0 1 1 1 6 6 0 0 0 12 0 1 1 0 0 1 2 0 8 8 0 0 1-7 7.93V21h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.07A8 8 0 0 1 4 12a1 1 0 0 1 1-1z"/></svg>
      </button>
      <span class="timer" id="timer">0:00</span>
      <button class="side-btn" id="pauseBtn" onclick="pauseRecording()" disabled title="Pauzeer">⏸</button>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendToClaude()" disabled>
      <span>Verwerk met Claude</span> <span>→</span>
    </button>
  </div>
</div>

<!-- Sheet overlay -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

<!-- Result sheet -->
<div class="sheet" id="resultSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-type-badge" id="sheetBadge">—</span>
    <span style="font-size:13px;color:var(--muted)" id="sheetSubtitle"></span>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">Claude verwerkt je opname…</div>
    </div>
  </div>
  <div class="sheet-footer" id="sheetFooter" style="display:none">
    <button class="copy-btn" onclick="copyOutput()">📋 Kopieer</button>
    <button class="notion-btn" id="notionBtn" onclick="sendToNotion()">📌 Naar Notion</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──
let recognition = null;
let isRecording = false;
let isPaused = false;
let finalTranscript = '';
let interimTranscript = '';
let timerInterval = null;
let seconds = 0;
let currentMode = 'notitie'; // notitie | vergadering
let resultData = null;

// ── Mode toggle ──
function toggleMode() {
  currentMode = currentMode === 'notitie' ? 'vergadering' : 'notitie';
  const badge = document.getElementById('modeBadge');
  badge.textContent = currentMode === 'notitie' ? '🎙 Notitie' : '👥 Vergadering';
}

// ── Speech Recognition setup ──
function setupRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('Spraakherkenning niet beschikbaar in deze browser');
    return null;
  }
  const r = new SpeechRecognition();
  r.lang = 'nl-BE'; // Belgisch-Nederlands
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onresult = (event) => {
    interimTranscript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += t + ' ';
      } else {
        interimTranscript = t;
      }
    }
    renderTranscript();
  };

  r.onend = () => {
    if (isRecording && !isPaused) {
      // Auto-restart for continuous long sessions
      try { r.start(); } catch(e) {}
    }
  };

  r.onerror = (e) => {
    if (e.error === 'no-speech') return;
    if (e.error === 'aborted') return;
    showToast('Fout: ' + e.error);
    stopRecording();
  };

  return r;
}

// ── Recording controls ──
function toggleRecording() {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

function startRecording() {
  recognition = setupRecognition();
  if (!recognition) return;

  isRecording = true;
  isPaused = false;
  seconds = 0;

  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const pauseBtn = document.getElementById('pauseBtn');
  const micIcon = document.getElementById('micIcon');

  btn.classList.add('recording');
  micIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"/>'; // stop icon
  status.textContent = 'Opname bezig…';
  status.classList.add('active');
  pauseBtn.disabled = false;
  document.getElementById('timer').classList.add('visible');

  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);

  try { recognition.start(); } catch(e) {}
}

function stopRecording() {
  isRecording = false;
  isPaused = false;

  if (recognition) { try { recognition.stop(); } catch(e) {} }
  clearInterval(timerInterval);

  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const pauseBtn = document.getElementById('pauseBtn');
  const micIcon = document.getElementById('micIcon');

  btn.classList.remove('recording');
  micIcon.innerHTML = '<path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v7a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm-7 8a1 1 0 0 1 1 1 6 6 0 0 0 12 0 1 1 0 0 1 2 0 8 8 0 0 1-7 7.93V21h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.07A8 8 0 0 1 4 12a1 1 0 0 1 1-1z"/>';

  const hasText = finalTranscript.trim().length > 0;
  status.textContent = hasText ? `Opname gestopt — ${seconds}s` : 'Klaar om op te nemen';
  status.classList.remove('active');
  pauseBtn.disabled = true;

  interimTranscript = '';
  renderTranscript();

  document.getElementById('sendBtn').disabled = !hasText;
  if (hasText) document.getElementById('clearBtn').disabled = false;
}

function pauseRecording() {
  if (!isRecording) return;
  isPaused = !isPaused;
  const btn = document.getElementById('pauseBtn');
  const status = document.getElementById('recordStatus');

  if (isPaused) {
    try { recognition.stop(); } catch(e) {}
    clearInterval(timerInterval);
    btn.textContent = '▶️';
    status.textContent = 'Gepauzeerd';
    status.classList.remove('active');
  } else {
    try { recognition.start(); } catch(e) {}
    timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
    }, 1000);
    btn.textContent = '⏸';
    status.textContent = 'Opname bezig…';
    status.classList.add('active');
  }
}

// ── Transcript rendering ──
function renderTranscript() {
  const el = document.getElementById('transcriptEl');
  const combined = finalTranscript + interimTranscript;

  if (!combined.trim()) {
    el.className = 'transcript-text placeholder';
    el.innerHTML = 'Druk op de knop en spreek in het Nederlands.\n\nGebruik voor korte notities of tijdens een vergadering.';
    document.getElementById('charCount').textContent = '';
    return;
  }

  el.className = 'transcript-text';
  el.innerHTML = escHtml(finalTranscript) +
    (interimTranscript ? `<span class="interim">${escHtml(interimTranscript)}</span>` : '');

  const total = combined.trim().length;
  document.getElementById('charCount').textContent = total > 100 ? `${total} tekens` : '';

  // Auto-scroll
  el.scrollTop = el.scrollHeight;
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function clearTranscript() {
  if (isRecording) stopRecording();
  finalTranscript = '';
  interimTranscript = '';
  renderTranscript();
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('timer').classList.remove('visible');
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('recordStatus').textContent = 'Klaar om op te nemen';
  seconds = 0;
}

// ── Send to Claude ──
async function sendToClaude() {
  const text = finalTranscript.trim();
  if (!text) return;

  openSheet();
  setSheetLoading();

  try {
    // Roept de eigen serverside proxy aan (Cloudflare Pages Function).
    // De API-sleutel en het model zitten veilig serverside — nooit in deze pagina.
    const resp = await fetch('/api/process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript: text, mode: currentMode })
    });

    let data = {};
    try { data = await resp.json(); } catch(e) {}

    if (!resp.ok || data.error) {
      setSheetError(data.error || `Verwerking mislukt (${resp.status}).`);
      return;
    }

    resultData = data.result;
    renderResult(resultData);

  } catch(e) {
    setSheetError('Kon de server niet bereiken: ' + e.message);
  }
}

// ── Sheet ──
function openSheet() {
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('resultSheet').classList.add('open');
}

function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('resultSheet').classList.remove('open');
}

function setSheetLoading() {
  document.getElementById('sheetBadge').textContent = '…';
  document.getElementById('sheetBadge').className = 'sheet-type-badge badge-acties';
  document.getElementById('sheetSubtitle').textContent = '';
  document.getElementById('sheetFooter').style.display = 'none';
  document.getElementById('sheetBody').innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">Claude verwerkt je opname…</div>
    </div>`;
}

function setSheetError(msg) {
  document.getElementById('sheetBody').innerHTML = `
    <div class="loading-state">
      <div style="font-size:32px">⚠️</div>
      <div class="loading-text" style="color:var(--danger)">${msg}</div>
    </div>`;
}

function renderResult(r) {
  const badge = document.getElementById('sheetBadge');
  const subtitle = document.getElementById('sheetSubtitle');
  badge.textContent = r.mode === 'verslag' ? '📄 Vergaderverslag' : '✅ Actiepunten';
  badge.className = 'sheet-type-badge ' + (r.mode === 'verslag' ? 'badge-verslag' : 'badge-acties');
  subtitle.textContent = r.reden;

  let html = `<div class="result-summary">${escHtml(r.samenvatting)}</div>`;

  if (r.vergadering?.beslissingen?.length > 0) {
    html += `<div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Beslissingen</div>`;
    r.vergadering.beslissingen.forEach(b => {
      html += `<div style="padding:8px 12px;background:var(--surface);border-radius:8px;font-size:13px;margin-bottom:6px;border-left:3px solid var(--brand)">• ${escHtml(b)}</div>`;
    });
    html += '</div>';
  }

  if (r.actiepunten?.length > 0) {
    html += `<div class="project-picker">
      <label for="projectSelect">Project (voor Notion)</label>
      <select id="projectSelect" class="project-select">
        <option value="">— Geen project —</option>
      </select>
    </div>`;

    html += `<div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px">Actiepunten (${r.actiepunten.length}) · tik om te (de)selecteren</div>
    <div class="acties-list">`;

    r.actiepunten.forEach((a, i) => {
      if (typeof a._selected === 'undefined') {
        a._selected = (a.houder || 'Yannick').toLowerCase().includes('yannick');
      }
      html += `<div class="actie-item ${a._selected ? 'selected' : ''}" id="actie_${i}" onclick="toggleActie(${i})">
        <div class="actie-desc"><span class="actie-check">✓</span>${escHtml(a.omschrijving)}</div>
        <div class="actie-meta">
          <span class="actie-chip">${escHtml(a.houder || 'Yannick')}</span>
          ${a.prioriteit === 'hoog' ? '<span class="actie-chip" style="background:#FEE2E2;color:#B91C1C">⚡ hoog</span>' : ''}
          ${a.deadline ? `<span class="actie-chip deadline">📅 ${escHtml(a.deadline)}</span>` : ''}
        </div>
        ${!a.deadline ? `<input class="deadline-input" type="date" onclick="event.stopPropagation()"
          onchange="updateDeadline(${i}, this.value)" value="">` : ''}
      </div>`;
    });
    html += '</div>';
  }

  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheetFooter').style.display = 'flex';

  // Notion-knop enkel tonen als er actiepunten zijn; projecten laden voor de dropdown
  const notionBtn = document.getElementById('notionBtn');
  if (r.actiepunten?.length > 0) {
    if (notionBtn) notionBtn.style.display = 'flex';
    loadProjecten();
  } else if (notionBtn) {
    notionBtn.style.display = 'none';
  }
}

function updateDeadline(i, val) {
  if (resultData?.actiepunten?.[i]) {
    resultData.actiepunten[i].deadline = val;
  }
}

// ── Actiepunten (de)selecteren ──
function toggleActie(i) {
  const a = resultData?.actiepunten?.[i];
  if (!a) return;
  a._selected = !a._selected;
  const el = document.getElementById('actie_' + i);
  if (el) el.classList.toggle('selected', a._selected);
}

function selectedActies() {
  if (!resultData?.actiepunten) return [];
  return resultData.actiepunten.filter(a => a._selected);
}

// ── Projecten ophalen voor de dropdown ──
async function loadProjecten() {
  const sel = document.getElementById('projectSelect');
  if (!sel) return;
  try {
    const resp = await fetch('/api/notion');
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || resp.status);
    (data.projecten || []).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.code ? `${p.naam} (${p.code})` : p.naam;
      sel.appendChild(opt);
    });
  } catch (e) {
    const opt = document.createElement('option');
    opt.textContent = '⚠️ Projecten laden mislukt';
    opt.disabled = true;
    sel.appendChild(opt);
  }
}

// ── Output ──
function buildActiesText() {
  return selectedActies().map(a => {
    let line = `- ${a.omschrijving}`;
    if (a.deadline) line += ` (deadline ${a.deadline})`;
    return line;
  }).join('\n');
}

function copyOutput() {
  const text = buildActiesText() || resultData?.samenvatting || '';
  navigator.clipboard.writeText(text).then(() => showToast('Gekopieerd!'));
}

// ── Wegschrijven naar Notion ──
async function sendToNotion() {
  const acties = selectedActies();
  if (acties.length === 0) { showToast('Geen actiepunten geselecteerd'); return; }

  const sel = document.getElementById('projectSelect');
  const project = sel ? sel.value : '';
  const btn = document.getElementById('notionBtn');
  const origLabel = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Bezig…'; }

  try {
    const resp = await fetch('/api/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        project,
        actiepunten: acties.map(a => ({
          omschrijving: a.omschrijving,
          deadline: a.deadline || null,
          prioriteit: a.prioriteit || 'normaal',
        })),
      }),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || data.error) {
      showToast(data.error || `Notion-fout (${resp.status})`);
      if (btn) { btn.disabled = false; btn.innerHTML = origLabel; }
      return;
    }
    const extra = data.failed ? ` (${data.failed} mislukt)` : '';
    showToast(`✅ ${data.created} taak/taken in Notion${extra}`);
    closeSheet();
  } catch (e) {
    showToast('Kon Notion niet bereiken: ' + e.message);
    if (btn) { btn.disabled = false; btn.innerHTML = origLabel; }
  }
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Service Worker registratie ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// Init
renderTranscript();
</script>
</body>
</html>
